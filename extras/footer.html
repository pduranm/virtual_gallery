<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Footer Arte y Pintura</title>
</head>
<body>
  <!-- Uso del componente -->
  <mi-footer></mi-footer>

  <script>
    class MiFooter extends HTMLElement {
      constructor() {
        super();
        this.attachShadow({ mode: 'open' });

        const wrapper = document.createElement('footer');
        wrapper.innerHTML = `
          <nav>
            <a href="#gallery" title="Galería">🖼️</a>
            <a href="#palette" title="Paleta de colores">🎨</a>
            <a href="#brushes" title="Pinceles">🖌️</a>
            <a href="#sculpture" title="Escultura">🗿</a>
            <a href="#music" title="Música">🎵</a>
          </nav>
        `;

        const style = document.createElement('style');
        style.textContent = `
          footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #fff;
            border-top: 1px solid #ddd;
            padding: 8px 0;
            display: flex;
            justify-content: center;
            z-index: 1000;
          }
          nav {
            display: flex;
            justify-content: space-around;
            width: 100%;
            max-width: 500px;
          }
          nav a {
            text-decoration: none;
            font-size: 22px;
            color: #222;
            flex: 1;
            text-align: center;
          }
          nav a:hover {
            color: #e63946;
          }
        `;

        this.shadowRoot.append(style, wrapper);
      }
    }

    customElements.define('mi-footer', MiFooter);
  </script>
</body>
</html>
