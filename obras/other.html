<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Artistas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
        }

        .artwork {
            background: white;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .artwork img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #ccc;
            border-radius: 5px;
        }

        .artwork h3 {
            margin: 10px 0 5px;
            background-color: rgb(105, 76, 38);
        }

        .artwork p {
            color: #666;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Galería de Claude Monet</h1>
        <div class="gallery" id="gallery">
            <!-- Se insertarán los cuadros dinámicamente -->
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const paintings = [
                {
                    name: "Impresión, sol naciente", year: 1872,
                    description: "'Impresión, sol naciente' de Claude Monet es una obra emblemática del Impresionismo, que captura un amanecer en el puerto de Le Havre. La pintura destaca por su uso innovador de la luz y el color, creando una atmósfera de neblina y reflejos que desafían las convenciones artísticas de su tiempo."
                },
                { name: "Mujer con sombrilla", year: 1875 },
                { name: "Nenúfares", year: 1899 },
                { name: "El puente japonés", year: 1920 }
            ];


            const gallery = document.getElementById("gallery");

            paintings.forEach(painting => {
                const div = document.createElement("div");
                const description = document.createElement("description");

                div.classList.add("artwork");

                div.innerHTML = `
                        <img src="https://via.placeholder.com/300x200" width="300" height="200" style="background-color:black;">
                    <h3>${painting.name}</h3>
                    <p><i>${painting.year}<i></p>
                `;

                description.innerHTML = 
                `<p>${painting.description}</p>`;
                gallery.appendChild(div, description);
            });
        });
    </script>
</body>

</html>
