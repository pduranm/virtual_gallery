<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artista</title>
  <style>
    * {margin:0; padding:0; box-sizing:border-box; font-family:Arial, sans-serif;}
    body {display:flex; flex-direction:column; min-height:100vh; background:#fff; color:#000;}
    header.hero {
      display:flex; height:100vh;
    }
    .hero-text {
      flex:1; background:#000; color:#fff;
      display:flex; flex-direction:column; justify-content:center; align-items:flex-start;
      padding:40px;
    }
    .hero-text h1 {font-size:2.5rem; margin-bottom:15px;}
    .hero-text p {font-size:1.1rem; margin-bottom:20px;}
    .hero-text a {
      background:#fff; color:#000; text-decoration:none;
      padding:12px 25px; border:2px solid #fff; transition:0.3s;
    }
    .hero-text a:hover {background:#000; color:#fff;}
    .hero-img {
      flex:1; position:relative; overflow:hidden;
    }
    .hero-img img {
      width:100%; height:100%; object-fit:cover;
      position:absolute; top:0; left:0; opacity:0; transition:opacity 1.5s ease-in-out;
    }
    .hero-img img.active {opacity:1;}


    /* --- Mobile --- */
    @media (max-width: 768px) {
      header.hero {
        flex-direction:column;
        height:auto;
      }
      .hero-img {
        order: -1;
        height:40vh;
      }
      .hero-img img {
        position:relative;
        height:100%;
      }
      .hero-text {
        align-items:center;
        text-align:center;
        padding:20px;
      }
    }
  </style>
</head>
<body>
  <header class="hero">
    <div class="hero-text">
      <h1>Título</h1>
      <h2><i>Año</i></h2>
      <p>Un mensaje simple.</p>
    </div>
    <div class="hero-img">
      <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/3/37/Eug%C3%A8ne_Delacroix_-_Jeune_orpheline_au_cimeti%C3%A8re_%28vers_1824%29.JPG/492px-Eug%C3%A8ne_Delacroix_-_Jeune_orpheline_au_cimeti%C3%A8re_%28vers_1824%29.JPG" alt="Turner - The Fighting Temeraire" class="active">
    </div>
  </header>

  

  <script>
    const images = document.querySelectorAll('.hero-img img');
    let index = 0;
    setInterval(() => {
      images[index].classList.remove('active');
      index = (index + 1) % images.length;
      images[index].classList.add('active');
    }, 5000);
  </script>
</body>
</html>
