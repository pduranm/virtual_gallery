El <a href="influencias/japonismo.html">japonismo</a>, fue una corriente que Cassatt, como muchas
otras siguieron, debido al poder del imperio nipón y de su exótica casuística.
Las coleccionistas Émile Guimé o Gertrud Bandervild son un claro ejemplo de grandes colecciones de
arte japonés, que influyó a todos aquellos a los que llegó.
