<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evolución de Movimientos Artísticos | Cronología Circular</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f1115;
            --text-main: #f5f5f7;
            --gold-accent: #c5a059;
            --font-display: 'Cinzel', serif;
            --font-body: 'Lora', serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-body);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        header h1 {
            font-family: var(--font-display);
            font-size: 2.2rem;
            letter-spacing: 4px;
            color: var(--gold-accent);
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        header p {
            font-size: 1rem;
            color: #8e95a5;
            letter-spacing: 1px;
        }

        .chart-container {
            position: relative;
            width: 100%;
            max-width: 650px;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        svg {
            width: 100%;
            height: 100%;
            overflow: visible;
            filter: drop-shadow(0 15px 35px rgba(0, 0, 0, 0.6));
        }

        .slice-group {
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-origin: 300px 300px;
        }

        .slice-group:hover {
            transform: scale(1.04);
        }

        .slice-path {
            stroke: #161922;
            stroke-width: 3;
            transition: filter 0.3s ease;
        }

        .slice-group:hover .slice-path {
            filter: brightness(1.2) drop-shadow(0 0 12px rgba(255, 255, 255, 0.25));
        }

        .slice-text {
            font-family: var(--font-display);
            fill: #ffffff;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 1px;
            text-anchor: middle;
            pointer-events: none;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.9);
        }

        .slice-year {
            font-family: var(--font-body);
            fill: #ffdca3;
            font-size: 10px;
            font-style: italic;
            text-anchor: middle;
            pointer-events: none;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.9);
        }

        /* Centro de la rueda decorativo / informativo */
        .chart-center {
            position: absolute;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: radial-gradient(circle, #1e222d 0%, #12141a 100%);
            border: 2px solid var(--gold-accent);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 10px;
            box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.8), 0 0 20px rgba(197, 160, 89, 0.2);
            pointer-events: none;
        }

        .chart-center-title {
            font-family: var(--font-display);
            font-size: 0.85rem;
            color: var(--gold-accent);
            letter-spacing: 2px;
        }

        .chart-center-subtitle {
            font-size: 0.7rem;
            color: #9aa0a6;
            margin-top: 4px;
        }

        @media (max-width: 480px) {
            header h1 {
                font-size: 1.6rem;
            }

            .chart-center {
                width: 110px;
                height: 110px;
            }

            .chart-center-title {
                font-size: 0.7rem;
            }

            .chart-center-subtitle {
                font-size: 0.6rem;
            }

            .slice-text {
                font-size: 9px;
            }

            .slice-year {
                font-size: 8px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Influencias del impresionismo</h1>
        <p>Elige un periodo para explorar su contexto</p>
    </header>

    <div class="chart-container">
        <!-- SVG de 600x600 px. Textos horizontales centrados en cada cuadrante -->
        <svg viewBox="0 0 600 600">
            <!-- 1. RENACIMIENTO (0° a 45°) -->
            <g class="slice-group">
                <path class="slice-path" fill="#8B263E" d="M 300 300 L 560 300 A 260 260 0 0 1 483.85 483.85 Z" />
                <text class="slice-text" x="465" y="375">Japonismo</text>
                <text class="slice-year" x="465" y="393">1870 – 1920</text>
            </g>

            <!-- 2. BARROCO (45° a 90°) -->
            <g class="slice-group">
                <path class="slice-path" fill="#9C5221" d="M 300 300 L 483.85 483.85 A 260 260 0 0 1 300 560 Z" />
                <text class="slice-text" x="375" y="470">Giverny</text>
                <text class="slice-year" x="375" y="488">1600 – 1750</text>
            </g>

            <!-- 3. NEOCLASICISMO (90° a 135°) -->
            <g class="slice-group">
                <path class="slice-path" fill="#2E5A88" d="M 300 300 L 300 560 A 260 260 0 0 1 116.15 483.85 Z" />
                <text class="slice-text" x="225" y="470">Bougival</text>
                <text class="slice-year" x="225" y="488">1760 – 1830</text>
            </g>

            <!-- 4. ROMANTICISMO (135° a 180°) -->
            <g class="slice-group">
                <path class="slice-path" fill="#4B3065" d="M 300 300 L 116.15 483.85 A 260 260 0 0 1 40 300 Z" />
                <text class="slice-text" x="135" y="375">Etretat</text>
                <text class="slice-year" x="135" y="393">1790 – 1850</text>
            </g>

            <!-- 5. REALISMO (180° a 225°) -->
            <g class="slice-group">
                <path class="slice-path" fill="#3D5A45" d="M 300 300 L 40 300 A 260 260 0 0 1 116.15 116.15 Z" />
                <text class="slice-text" x="135" y="235">Barbizon</text>
                <text class="slice-year" x="135" y="253">1848 – 1880</text>
            </g>

            <!-- 6. IMPRESIONISMO (225° a 270°) -->
            <g class="slice-group">
                <path class="slice-path" fill="#B38600" d="M 300 300 L 116.15 116.15 A 260 260 0 0 1 300 40 Z" />
                <text class="slice-text" x="225" y="140">IMPRESIONISMO</text>
                <text class="slice-year" x="225" y="158">1867 – 1886</text>
            </g>

            <!-- 7. POSTIMPRESIONISMO (270° a 315°) -->
            <g class="slice-group">
                <path class="slice-path" fill="#1C7C75" d="M 300 300 L 300 40 A 260 260 0 0 1 483.85 116.15 Z" />
                <text class="slice-text" x="375" y="140">POSTIMPRESIONISMO</text>
                <text class="slice-year" x="375" y="158">1886 – 1905</text>
            </g>

            <!-- 8. VANGUARDIAS (315° a 360°) -->
            <g class="slice-group">
                <path class="slice-path" fill="#9E3B2B" d="M 300 300 L 483.85 116.15 A 260 260 0 0 1 560 300 Z" />
                <text class="slice-text" x="465" y="235">VANGUARDIAS</text>
                <text class="slice-year" x="465" y="253">1905 – 1940</text>
            </g>
        </svg>

        <!-- Nodo Central -->
        <div class="chart-center">
            <span class="chart-center-title">Virtual Gallery</span>
            <span class="chart-center-subtitle">Influencias</span>
        </div>
    </div>

</body>
</html>
