<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Principal - Revista de Arte</title>
    <!-- Carga de las fuentes Lora y Cinzel -->
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@700&family=Cinzel:wght@700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style_main.css">
    <style>
        body {
            font-family: 'Lora', serif;
            margin: 0;
            padding: 0;
            background-color: #e8f6f7;
            color: #333;

            overflow-x: hidden;

        }

        header.main-header {
            background-color: #ffffff;
            color: white;
            width: 100%;
            padding: 1px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 20;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .header-content {
            flex-grow: 1;
            text-align: center;
        }

        header h1 {
            margin: 0px;
            font-size: 2.5em;
        }

        header h2 {
            margin: 0;
            font-size: 1.5em;
        }

        /* Layout de Galería (Grid Container) */
        main.grid-container {
            display: grid;
            /* La rejilla usa auto-fill para ser responsive y colocar tarjetas de min. 150px */
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            /* Aumentado a 25px para mejor separación visual */
            padding: 20px;
            width: 85%;
            max-width: 1200px;
            margin: 20px auto;
        }

        /* Se mantienen las clases del CSS original para los elementos internos del grid */
        .grid-item {
            break-inside: avoid;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .grid-item:hover {
            transform: scale(1.03);
            /* Ligero aumento al pasar el ratón */
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .grid-item img {
            width: 100%;
            height: 200px;
            /* Altura fija para miniaturas de artículos */
            display: block;
            object-fit: cover;
        }

        .item-content {
            padding: 15px;
        }

        .item-content h3 {
            font-family: 'Cinzel', serif;
            font-size: 1.4em;
            margin-top: 0;
            margin-bottom: 5px;
            color: #000000;
            /* Color del borde inferior del h1_main */
        }

        .item-content p {
            font-size: 0.9em;
            color: #555;
        }

        /* Título de la sección principal */
        .h1_main {
            font-family: 'Cinzel', serif;
            font-size: 20px;
            text-align: center;
            margin: 0 auto 0;
            padding: 15px 0;
            border-top: 2px solid #776b5e;
            border-bottom: 3px solid #ec8c8c;
            color: #000000;
            max-width: 900px;
            width: 90%;
        }

        a {
            text-decoration: none;
        }

        .hamburger-button {
            display: block;
            cursor: pointer;
            background: none;
            border: none;
            color: rgb(0, 0, 0);
            font-size: 1.5em;
            padding: 0 15px;
            z-index: 30;
        }

        /* Ocultar el botón en PC */
        @media (min-width: 901px) {
            .hamburger-button {
                display: none;
            }

            .main-nav {
                display: flex !important;
                justify-content: center;
                gap: 20px;
                border-bottom: 1px solid #ddd;
                padding: 10px 0;
            }
        }

        /*nav-bar menu*/
        #off-canvas-menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 250px;
            height: 100%;
            background-color: #ffffff;
            transform: translateX(-100%);
            transition: transform 0.3s ease-out;
            z-index: 1000;
            box-shadow: 2px 0 5px rgba(0, 0, 0, 0.5);
            padding: 20px 0;
        }

        #off-canvas-menu.open {
            transform: translateX(0);
        }

        #off-canvas-menu a {
            display: block;
            padding: 10px 20px;
            color: #000;
            font-weight: bold;
            border-bottom: 1px solid #eee;
        }

        #off-canvas-menu a:hover {
            background-color: #e8f6f7;
            color: #000;
        }

        /* Overlay (Fondo oscuro) */
        #menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease-out;
        }

        #menu-overlay.open {
            opacity: 1;
            visibility: visible;
        }
    </style>
</head>

<body>

    <!-- NAVEGACIÓN LATERAL (Off-Canvas - SOLO MÓVIL) -->
    <nav id="off-canvas-menu">
        <div style="padding: 0 20px 20px;">
            <h3 style="margin-top: 0; color: #333; font-family: 'Cinzel', serif;">Menú</h3>
            <!-- Botón de Cierre -->
            <button onclick="toggleMenu()"
                style="position: absolute; top: 10px; right: 10px; background: none; border: none; font-size: 1.5em; cursor: pointer; color: #555;">
                &times;
            </button>
        </div>

        <a href="#">Inicio</a>
        <a href="#">Movimientos</a>
        <a href="#">Influencias</a>
        <a href="#">Artistas</a>
        <a href="#">Artículos</a>
    </nav>
    <div id="menu-overlay" onclick="toggleMenu()"></div>

    <!-- CABECERA PRINCIPAL (Con Logo/Título) -->
    <header class="main-header">
        <button class="hamburger-button" onclick="toggleMenu()">☰</button>
        <div class="header-content">
            <h1 class="h1_main" style="padding: 5px;">Virtual Gallery</h1>
        </div>
        <!-- Placeholder para mantener la alineación en PC -->
        <div class="hamburger-button" style="visibility: hidden;">☰</div>
    </header>
    <main class="grid-container">

        <!-- TARJETA 1 -->
        <a href="other_main.html" class="grid-item">
            <img src="https://placehold.co/150x185/000/ffffff?text=Movimientos">
            <div class="item-content">
                <h3>Explora el contenido</h3>
                <p></p>
            </div>
        </a>

        <!-- TARJETA 2 -->
        <a href="movimientos/realismo.html" class="grid-item">
            <img src="https://placehold.co/400x200/fff/000000?text=Artículos">
            <div class="item-content">
                <h3></h3>
                <p>Descripciones, artículos de opinión.</p>
            </div>
        </a>

    </main>

    <script>
        // Lógica del menú lateral (Off-Canvas)
        const sidebar = document.getElementById('off-canvas-menu');
        const overlay = document.getElementById('menu-overlay');
        const navMain = document.querySelector('.main-nav');

        // Función para abrir/cerrar el menú
        function toggleMenu() {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('open');
            document.body.style.overflow = sidebar.classList.contains('open') ? 'hidden' : 'auto';
        }

        // Lógica de visualización del menú principal en PC
        const checkWindowSize = () => {
            if (window.innerWidth > 900) {
                // Ocultar el menú lateral de móvil y mostrar el de PC
                sidebar.classList.remove('open');
                overlay.classList.remove('open');
                document.body.style.overflow = 'auto';
                if (navMain) navMain.style.display = 'flex';
            } else {
                // Ocultar el menú de PC en móvil
                if (navMain) navMain.style.display = 'none';
            }
        };

        // Ejecutar al cargar y redimensionar
        window.onload = checkWindowSize;
        window.addEventListener('resize', checkWindowSize);
    </script>
</body>

</html>
