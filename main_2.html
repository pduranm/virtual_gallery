    <style>
        /* Variables y Reset Minimalista */
        :root {
            --color-fondo: #f9f7f7;
            /* Blanco roto */
            --color-principal: #333333;
            /* Gris oscuro */
            --color-acento: #a0a0a0;
            /* Gris medio */
            --fuente-serif: 'Playfair Display', serif;
            --fuente-sans: 'Montserrat', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--fuente-serif);
            color: var(--color-principal);
            background-color: var(--color-fondo);
            line-height: 1.6;
            padding: 20px;
        }

        /* Tipografía y Encabezados */
        h1,
        h2,
        h3 {
            font-family: var(--fuente-sans);
            text-transform: uppercase;
            letter-spacing: 3px;
            /* Más espaciado para un look elegante */
            margin-bottom: 0.5em;
            color: var(--color-principal) !important;
            /* Sobrescribe colores de Bootstrap/vendor */
        }

        h1 {
            font-size: 2.5em;
            text-align: center;
            padding-bottom: 5px;
            border-bottom: 1px solid var(--color-acento);
            margin-bottom: 0;
        }

        h2 {
            font-size: 1.2em;
            text-align: center;
            letter-spacing: 5px;
            font-weight: 300;
        }

        /* Estilos de la Sección HERO (Cabecera) */
        #hero {
            /* Asegura que el contenido esté centrado verticalmente */
            min-height: 50vh;
            padding: 100px 0;
            margin-top: 0 !important;
            /* Anula el margin-top:-85px; */
            background-color: var(--color-fondo);
        }

        /* Contenedor de Enlaces de Movimientos (Simplificado del 'icon-box') */
        .row.gy-4.mt-5 {
            margin-top: 50px !important;
            /* Espacio después del título */
        }

        .icon-box {
            /* Diseño minimalista para los botones/enlaces */
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px 10px;
            margin-bottom: 15px;
            border: 1px solid var(--color-acento);
            background-color: transparent !important;
            /* Elimina colores de fondo */
            border-radius: 0 !important;
            /* Elimina el borde redondeado */
            transition: background-color 0.3s, border-color 0.3s;
        }

        .icon-box:hover {
            background-color: var(--color-acento);
            /* Efecto hover sutil */
            border-color: var(--color-principal);
        }

        .icon-box h3 {
            margin: 0 !important;
            font-size: 1.0em;
            letter-spacing: 1px;
            text-align: center;
        }

        .icon-box a {
            text-decoration: none;
            color: var(--color-principal) !important;
            /* Color de texto estándar */
            display: block;
            padding: 5px;
            /* Hace el área de click más grande */
        }

        .icon-box:hover a {
            color: var(--color-fondo) !important;
            /* Texto blanco/claro al pasar el ratón */
        }

        /* Estilo para el back-to-top, solo si el bi-arrow-up-short es de bootstrap-icons */
        .back-to-top {
            background: var(--color-principal);
            color: var(--color-fondo);
            border: 1px solid var(--color-principal);
        }

        .back-to-top:hover {
            background: var(--color-acento);
        }

        /* Ajustes específicos de la estructura del HTML original para aplicar el estilo */
        .col-xl-6.col-lg-8 {
            padding-bottom: 40px;
        }

        .col-xl-2.col-md-4 {
            /* Ajuste para que todos los elementos de la lista fluyan en una línea si es posible */
            max-width: 250px;
            flex: 0 0 auto;
            width: 100%;
        }
        
        /* Contenedor extra para Artistas (lo movemos a la fila de los otros) */
        .artist-link-container {
             /* Usamos la misma estructura de columna para consistencia */
            max-width: 250px;
            flex: 0 0 auto;
            width: 100%;
            margin-top: 15px; /* Separación de la fila superior */
        }

    </style>
</head>
