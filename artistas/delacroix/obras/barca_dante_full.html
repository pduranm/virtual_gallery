<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artista</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lora:wght@400&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Lora', serif;
        }

        body {
            display: flex;
            flex-direction: column;
            
            background: #000000;
            color: #ffffff;
            text-align: justify;
            justify-content: justify;
        }

        h1 {
            text-align: center;
        }

        header.hero {
            display: flex;
            /* height: 100vh; */
        }

        .hero-text {
            flex: 1;
            background: #ffffff;
            color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            padding: 40px;
        }

        .hero-text h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }

        .hero-text p {
            font-size: 1.1rem;
            margin-bottom: 20px;
        }

        /* .hero-text a {
            background: #fff;
            color: #000;
            text-decoration: none;
            padding: 12px 25px;
            border: 2px solid #fff;
            transition: 0.3s;
        } */

        .hero-img {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .hero-img img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
        }

        .hero-img img.active {
            opacity: 1;
        }


        /* --- Mobile --- */
        @media (max-width: 768px) {
            header.hero {
                flex-direction: column;
                height: auto;
            }

            .hero-img {
                order: -1;
                height: 40vh;
            }

            .hero-img img {
                position: relative;
                height: 100%;
            }

            .hero-text {
                align-items: center;
                text-align: center;
                padding: 20px;
                text-align: justify;

            }

            .text-full {
                grid-column: span 2;
                background-color: rgb(255, 255, 255);
                border-radius: 10px;
                /* box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); */
                overflow: hidden;
                color: black;
            }
        }
    </style>
</head>

<body>
    <header class="hero">
        <div class="hero-text">
            <h1>La barca de Dante</h1>
            <h2><i>1822</i></h2>
            <h3>Contexto Histórico</h3>
            
        </div>
    </header>
</body>

</html>
