<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camille Corot | Virtual Gallery</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@400;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --color-primary: #1a1a1a;
            --color-secondary: #b58d53;
            --color-background: #fdfdfd;
            --color-light: #e6e6e6;
            --font-serif-display: 'Cinzel', serif;
            --font-serif-body: 'Lora', serif;
            --header-height: 80px;
            --transition-smooth: all 0.5s cubic-bezier(0.2, 1, 0.3, 1);
        }


        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-serif-body);
            background-color: var(--color-background);
            color: var(--color-primary);
            overflow-x: hidden;
            line-height: 1.6;
        }


        .main-header {
            position: fixed;
            top: 0;
            width: 100%;
            height: var(--header-height);
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 50px;
            border-bottom: 1px solid #eee;
            z-index: 2000;
        }

        .logo a {
            font-family: var(--font-serif-display);
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 4px;
            text-decoration: none;
            color: var(--color-primary);
            cursor: pointer;
        }

        .nav-container {
            display: flex;
            height: 100%;
        }

        .nav-item {
            display: flex;
            align-items: center;
            padding: 0 25px;
            height: 100%;
            cursor: pointer;
        }

        .nav-link {
            font-family: var(--font-serif-display);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-decoration: none;
            color: var(--color-primary);
            font-weight: 700;
            position: relative;
        }

        .nav-link:hover,
        .nav-link.active {
            color: var(--color-secondary);
        }


        .menu-toggle {
            display: none;
            flex-direction: column;
            justify-content: space-between;
            width: 30px;
            height: 20px;
            background: transparent;
            border: none;
            cursor: pointer;
            z-index: 2100;
        }

        .menu-toggle span {
            width: 100%;
            height: 2px;
            background-color: var(--color-primary);
            transition: 0.3s;
        }


        .main-content {
            margin-top: var(--header-height);
            min-height: calc(100vh - var(--header-height));
        }


        .detail-layout {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 60px;
            max-width: 1400px;
            margin: 0 auto;
            padding: 60px 40px;
        }

        .detail-portrait {
            width: 100%;
            border: 10px solid #fff;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            margin-bottom: 30px;
            object-fit: cover;
        }

        .detail-metadata {
            background-color: #f9f9f9;
            padding: 30px;
            border: 1px solid #eee;
        }

        .detail-metadata h4 {
            font-family: var(--font-serif-display);
            font-size: 0.9rem;
            margin-bottom: 15px;
            letter-spacing: 1px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 10px;
        }

        .meta-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.85rem;
        }

        .meta-label {
            font-weight: 700;
            color: #888;
        }

        .detail-main {
            padding-top: 10px;
        }

        .detail-name {
            font-family: var(--font-serif-display);
            font-size: 3.5rem;
            color: var(--color-primary);
            line-height: 1;
            margin-bottom: 10px;
        }

        .detail-subtitle {
            font-family: var(--font-serif-display);
            font-size: 1.1rem;
            color: var(--color-secondary);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 40px;
            display: block;
        }

        .detail-text {
            column-count: 2;
            column-gap: 40px;
            font-size: 1rem;
            line-height: 1.8;
            color: #444;
            margin-bottom: 60px;
            text-align: justify;
        }

        .drop-cap {
            float: left;
            font-family: var(--font-serif-display);
            font-size: 4rem;
            line-height: 0.8;
            margin-right: 15px;
            color: var(--color-secondary);
        }

        .works-section-title {
            font-family: var(--font-serif-display);
            font-size: 1.5rem;
            margin: 40px 0 20px 0;
            border-left: 4px solid var(--color-secondary);
            padding-left: 20px;
        }


        .works-grid-large {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 30px;
            width: 100%;
        }


        .work-card {
            background-color: #fff;
            border: 1px solid #eee;
            padding: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.02);
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: opacity 0.3s;
        }


        .work-card-thumb {
            width: 100%;
            aspect-ratio: 4/5;
            overflow: hidden;
            background-color: #f5f5f5;
            margin-bottom: 12px;
        }


        .work-card-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }


        .work-card-info {
            padding: 5px 2px;
        }

        .work-card-title {
            font-family: var(--font-serif-body);
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--color-primary);
            margin-bottom: 4px;
            line-height: 1.3;
        }

        .work-card-year {
            font-family: var(--font-serif-display);
            font-size: 0.75rem;
            color: var(--color-secondary);
            letter-spacing: 1px;
        }


        .work-card:hover {
            opacity: 0.9;
        }

        .work-card:hover .work-card-thumb img {
            transform: scale(1.1);
        }


        @media (max-width: 600px) {
            .works-grid-large {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 15px;
            }

            .work-card {
                padding: 8px;
            }

            .work-card-title {
                font-size: 0.85rem;
            }
        }


        footer {
            background-color: #f9f9f9;
            padding: 60px;
            text-align: center;
            border-top: 1px solid #eee;
            margin-top: 60px;
        }

        footer p {
            font-family: var(--font-serif-display);
            font-size: 0.8rem;
            color: #888;
        }


        @media (max-width: 900px) {
            .nav-container {
                display: none;
            }

            .menu-toggle {
                display: flex;
            }

            .main-header {
                padding: 0 20px;
            }

            .detail-layout {
                grid-template-columns: 1fr;
                gap: 40px;
                padding: 40px 20px;
            }

            .detail-text {
                column-count: 1;
            }

            .works-grid-mini {
                grid-template-columns: repeat(2, 1fr);
            }

            .detail-name {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
