<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Lista de regalos</title>
  <style>
    :root{font-family:system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;}
    body{margin:0;background:#f6f8fa;color:#0f172a;padding:24px}
    .container{max-width:980px;margin:0 auto;background:#fff;border-radius:12px;padding:20px;box-shadow:0 6px 18px rgba(8,15,30,.06)}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px}
    h1{font-size:20px;margin:0}
    .controls{display:flex;gap:8px;align-items:center}
    input,select,textarea{padding:8px 10px;border:1px solid #e6e9ef;border-radius:8px;font-size:14px}

    .form-row{display:flex;gap:8px;margin-top:12px}
    .form-row > *{flex:1}
    button{padding:10px 12px;border-radius:10px;border:0;cursor:pointer}
    .btn-primary{background:#0b5cff;color:#fff}
    .btn-ghost{background:transparent;border:1px solid #e6e9ef}

    .search{margin-top:14px;display:flex;gap:8px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:18px}
    .card{background:#fbfdff;border-radius:10px;padding:12px;border:1px solid #eef2ff}
    .card h3{margin:0;font-size:15px}
    .meta{font-size:13px;color:#475569;margin-top:6px}
    .actions{display:flex;gap:6px;margin-top:10px}
    .small{font-size:13px;padding:6px 8px;border-radius:8px}

    footer{margin-top:18px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}

    @media (max-width:520px){.form-row{flex-direction:column}}
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Lista de regalos</h1>
      <div class="controls">
        <button class="btn-ghost" id="exportBtn">Exportar JSON</button>
        <label class="btn-ghost" style="padding:8px 10px;border-radius:8px;cursor:pointer">
          Importar
          <input type="file" id="importFile" accept="application/json" style="display:none">
        </label>
        <button class="btn-ghost" id="clearAll">Borrar todo</button>
      </div>
    </header>

    <section class="form" aria-label="Añadir regalo">
      <div class="form-row">
        <input id="person" placeholder="Persona (ej: Sara)" />
        <input id="title" placeholder="Nombre del regalo (ej: Casa Up Lego)" />
      </div>
      <div class="form-row">
        <input id="link" placeholder="Enlace (https://...)" />
        <select id="family">
          <option value="">Elegir familia / grupo</option>
          <option>Familia Gamero Pocostales</option>
          <option>Familia Durán Matador</option>
          <option>Otros</option>
        </select>
      </div>
      <div style="margin-top:10px;display:flex;gap:8px">
        <input id="tag" placeholder="Etiqueta (opcional)" />
        <button class="btn-primary" id="addBtn">Añadir regalo</button>
      </div>
    </section>

    <section class="search">
      <input id="q" placeholder="Buscar por persona, regalo, etiqueta o familia" style="flex:1" />
      <select id="filterFamily">
        <option value="">Filtrar por familia</option>
        <option>Familia Gamero Pocostales</option>
        <option>Familia Durán Matador</option>
        <option>Otros</option>
      </select>
    </section>

    <main id="list" class="grid" aria-live="polite"></main>

    <footer>
      <div id="count">0 regalos</div>
      <div style="color:#64748b;font-size:13px">Los datos se guardan en el navegador (localStorage). Usa Exportar/Importar para compartir.</div>
    </footer>
  </div>

  <script>
    const STORAGE_KEY = 'lista_regalos_v1'
    let items = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]')

    const $ = id => document.getElementById(id)
    const listEl = $('list')
    const countEl = $('count')

    function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(items)) }

    function render(filter=''){
      const q = $('q').value.trim().toLowerCase()
      const familyFilter = $('filterFamily').value
      const filtered = items.filter(it => {
        if(familyFilter && it.family !== familyFilter) return false
        if(!q) return true
        return [it.person, it.title, it.tag, it.family].join(' ').toLowerCase().includes(q)
      })

      listEl.innerHTML = ''
      filtered.forEach((it, idx) => {
        const card = document.createElement('article')
        card.className = 'card'
        card.innerHTML = `
          <h3>${escapeHtml(it.title || '(sin título)')}</h3>
          <div class="meta"><strong>${escapeHtml(it.person || '')}</strong> · ${escapeHtml(it.family || '')}</div>
          <div class="meta">${escapeHtml(it.tag || '')}</div>
          <div class="actions">
            <a class="small btn-ghost" href="${escapeAttr(it.link)}" target="_blank" rel="noopener">Abrir enlace</a>
            <button class="small btn-ghost" data-idx="${idx}" onclick="editItem(${idx})">Editar</button>
            <button class="small" onclick="deleteItem(${idx})">Borrar</button>
          </div>
        `
        listEl.appendChild(card)
      })
      countEl.textContent = `${items.length} regalos (${filtered.length} visibles)`
    }

    function addItem(){
      const title = $('title').value.trim()
      const link = $('link').value.trim()
      const person = $('person').value.trim()
      const family = $('family').value
      const tag = $('tag').value.trim()
      if(!title && !link) return
      items.unshift({title,link,person,family,tag,created:Date.now()})
      save(); render()
      $('title').value=''; $('link').value=''; $('person').value=''; $('tag').value=''
    }

    function deleteItem(i){ if(!confirm('¿Borrar regalo?')) return; items.splice(i,1); save(); render() }

    function editItem(i){
      const it = items[i]
      const newTitle = prompt('Título', it.title) || it.title
      const newLink = prompt('Enlace', it.link) || it.link
      const newPerson = prompt('Persona', it.person) || it.person
      const newTag = prompt('Etiqueta', it.tag) || it.tag
      const newFamily = prompt('Familia/grupo', it.family) || it.family
      items[i] = {...it,title:newTitle,link:newLink,person:newPerson,tag:newTag,family:newFamily}
      save(); render()
    }

    function exportJson(){
      const blob = new Blob([JSON.stringify(items, null, 2)], {type:'application/json'})
      const url = URL.createObjectURL(blob)
      const a = document.createElement('a')
      a.href = url; a.download = 'lista_regalos.json'; a.click(); URL.revokeObjectURL(url)
    }

    function importFile(file){
      const reader = new FileReader()
      reader.onload = e => {
        try{
          const data = JSON.parse(e.target.result)
          if(Array.isArray(data)){
            items = data.concat(items)
            save(); render()
          } else alert('JSON inválido')
        }catch(err){ alert('Error al leer JSON') }
      }
      reader.readAsText(file)
    }

    function clearAll(){ if(confirm('Borrar TODOS los regalos?')){items=[]; save(); render()} }

    function escapeHtml(s){ if(!s) return ''; return s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;') }
    function escapeAttr(s){ if(!s) return '#'; return s.replaceAll('"','%22').replaceAll("'",'%27') }

    // eventos
    $('addBtn').addEventListener('click', addItem)
    $('q').addEventListener('input', () => render())
    $('filterFamily').addEventListener('change', () => render())
    $('exportBtn').addEventListener('click', exportJson)
    $('clearAll').addEventListener('click', clearAll)
    $('importFile').addEventListener('change', e => { if(e.target.files[0]) importFile(e.target.files[0]) })

    // render inicial
    render()

    // Exponer algunas funciones al global para botones inline
    window.deleteItem = deleteItem
    window.editItem = editItem
  </script>
</body>
</html>
